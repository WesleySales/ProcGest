<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="pt-br">
<head>
    <title>Cadastro de Procuração</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
<div class="container">
    <aside class="sidebar" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
        <h2>PROCGEST</h2>
        <ul>
            <li><a href="#" onclick="navegar('home')" class="ativo">🏠 <span class="texto">Home</span></a></li>
            <li><a href="home.html" onclick="navegar('home')">📄 <span class="texto">Procurações</span></a></li>
            <li><a href="cadastro.html" onclick="navegar('cadastrar')">➕ <span class="texto">Cadastrar Procuração</span></a></li>
            <li><a href="perfil.html" onclick="navegar('perfil')">👤 <span class="texto">Perfil</span></a></li>
        </ul>
    </aside>

    <main class="conteudo">
        <div class="conteudo-interno">
            <div class="cabecalhoCadastro">
                <h1>Lista de Procurações</h1>
                <p>Olá! Confira aqui as procurações cadastradas no sistema.</p>
            </div>

            <form id="upload-form">
                <div id="drop-zone">
                    <p>Arraste arquivos aqui ou clique para selecionar</p>
                    <input type="file" id="file-input" multiple>
                    <p id="drop-text">Nenhum arquivo selecionado</p>
                </div>
                <button type="submit">Enviar Arquivos</button>
            </form>

            <form id="formCadastroProcuracao">
                <label for="nomeProcurador">Nome do Procurador:</label>
                <input type="text" id="nomeProcurador" required>

                <div class="linha-formulario">
                    <div class="campo-formulario">
                        <label for="dataInicio">Data de Início:</label>
                        <input type="date" id="dataInicio" required>
                    </div>

                    <div class="campo-formulario">
                        <label for="dataVencimento">Data de Vencimento:</label>
                        <input type="date" id="dataVencimento" required>
                    </div>

                    <div class="campo-formulario">
                        <label for="boxStatus">Status:</label>
                        <select id="boxStatus">
                            <option value="PENDENTE" selected>Pendente</option>
                            <option value="ATIVO">Ativo</option>
                            <option value="VENCIDO">Vencido</option>
                        </select>
                    </div>
                </div>

                <button type="submit">Cadastrar Procuração</button>
            </form>

        </div>
    </main>
</div>


<script src="../static/js/upload.js"></script>

</body>
</html>
